<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — StreamFinder</title>
<style>
  :root {
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc; --border:#dfe5ec;
    --border-strong:#c5ced9; --text:#172033; --muted:#5f6c80;
    --accent:#2457d6; --accent-hover:#1c46ae; --accent-soft:#e8eefc;
    --ok:#15803d; --ok-soft:#e6f4ea; --bad:#b42318; --bad-soft:#fdecea;
    --warn:#9a5b00; --warn-soft:#fff4dc;
    --shadow:0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e131b; --surface:#151b25; --surface-2:#1a2230; --border:#262f3e;
      --border-strong:#36435a; --text:#e7ebf1; --muted:#97a3b6;
      --accent:#5b8def; --accent-hover:#7aa3f5; --accent-soft:#1c2a47;
      --ok:#4ade80; --ok-soft:#14301f; --bad:#f87171; --bad-soft:#3a1a1a;
      --warn:#fbbf24; --warn-soft:#3a2d10;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; padding:32px 16px; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    font-size:14px; line-height:1.5;
  }
  .wrap { max-width:960px; margin:0 auto; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
  h1 { margin:0 0 2px; font-size:20px; font-weight:700; letter-spacing:-.01em; }
  p.sub { margin:0; color:var(--muted); font-size:13px; }
  button {
    font-family:inherit; cursor:pointer; border:1px solid var(--border-strong);
    background:var(--surface); color:var(--text); border-radius:8px;
    padding:8px 14px; font-weight:600; font-size:13px; transition:.15s;
  }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button.danger { color:var(--bad); }
  button.danger:hover { border-color:var(--bad); background:var(--bad-soft); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  a { text-decoration:none; }
  .card {
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:24px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .card h3 { margin:0 0 14px; font-size:15px; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--border); }
  th { background:var(--surface-2); color:var(--muted); font-size:12px; font-weight:600; }
  tr:hover td { background:var(--surface-2); }
  label { display:block; margin:10px 0 6px; font-size:12px; font-weight:600; color:var(--muted); }
  input {
    padding:9px 12px; border:1px solid var(--border-strong); border-radius:8px;
    font-size:14px; width:100%; background:var(--surface); color:var(--text);
    font-family:inherit; outline:none; transition:.15s;
  }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .row { display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; }
  #msg { min-height:18px; font-size:13px; margin-top:10px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .tag {
    display:inline-block; padding:2px 10px; border-radius:999px;
    font-size:11px; font-weight:600; background:var(--accent-soft); color:var(--accent);
  }
  .tag.off { background:var(--bad-soft); color:var(--bad); }
  .tag.admin { background:var(--warn-soft); color:var(--warn); }
  .tag.ok { background:var(--ok-soft); color:var(--ok); }
  .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .actions button { padding:6px 12px; font-size:12px; }
  @media (max-width:640px) {
    .row { grid-template-columns:1fr; }
    .card { padding:18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div>
      <h1>Admin panel</h1>
      <p class="sub">Manage user IDs and permissions</p>
    </div>
    <div class="actions">
      <a href="/"><button>← Dashboard</button></a>
      <button id="logout">Log out</button>
    </div>
  </div>

  <div class="card" id="createCard">
    <h3>Create a new ID</h3>
    <div class="row">
      <div><label for="nid">ID</label><input id="nid" placeholder="lowercase, 3-32 chars"></div>
      <div><label for="npw">Password</label><input id="npw" type="password" placeholder="6+ characters"></div>
      <div><button class="primary" id="create">Create</button></div>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <h3>Users</h3>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Role</th><th>Status</th><th>Created by</th>
          <th>Found</th><th>Can create IDs</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="7" style="color:var(--muted)">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let me = null;

  const api = async (url, opts) => {
    const r = await fetch(url, opts);
    if (r.status === 401) { location.href = '/login'; throw new Error('Please log in'); }
    return r;
  };
  const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : 'bad'; };
  const jpost = body => ({
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  async function loadMe() {
    try {
      const r = await api('/api/me');
      me = await r.json();
      if (!me.canCreate) { location.href = '/'; }
    } catch (e) { location.href = '/login'; }
  }

  async function load() {
    const tbody = $('rows');
    tbody.innerHTML = '<tr><td colspan="7" style="color:var(--muted)">Loading...</td></tr>';
    const r = await api('/api/users');
    const j = await r.json();
    tbody.innerHTML = '';
    if (!j.users.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="color:var(--muted)">No users yet.</td></tr>';
      return;
    }
    j.users.forEach(u => {
      const tr = document.createElement('tr');
      const isSelf = me && me.id === u.id;
      const isAdmin = u.role === 'admin';
      tr.innerHTML = `
        <td><b>${u.id}</b>${isSelf ? ' <span class="tag">you</span>' : ''}</td>
        <td>${isAdmin ? '<span class="tag admin">admin</span>' : '<span class="tag">member</span>'}</td>
        <td>${u.disabled ? '<span class="tag off">disabled</span>' : '<span class="tag ok">active</span>'}</td>
        <td>${u.createdBy || '-'}</td>
        <td>${u.found}</td>
        <td>${isAdmin ? '✓ always' : (u.canCreate ? `✓ yes (${u.subCount}/${u.maxSub})` : '✗ no')}</td>
        <td></td>`;
      const td = tr.lastElementChild;
      const wrap = document.createElement('div');
      wrap.className = 'actions';

      if (!isAdmin || isSelf) {
        const btnDis = document.createElement('button');
        btnDis.textContent = u.disabled ? 'Enable' : 'Disable';
        btnDis.disabled = isSelf;
        if (!isSelf) btnDis.onclick = () => update({ id: u.id, disabled: !u.disabled });
        wrap.appendChild(btnDis);
      }

      const btnPw = document.createElement('button');
      btnPw.textContent = 'Password';
      btnPw.onclick = () => {
        const np = prompt('New password for ' + u.id + ' (6+ chars):');
        if (np) update({ id: u.id, password: np });
      };
      if (!isAdmin) wrap.appendChild(btnPw);

      if (me && me.role === 'admin' && !isAdmin) {
        const btnPerm = document.createElement('button');
        btnPerm.textContent = u.canCreate ? 'Revoke ID-create' : 'Allow ID-create';
        btnPerm.onclick = () => update({ id: u.id, canCreate: !u.canCreate });
        wrap.appendChild(btnPerm);

        const btnLim = document.createElement('button');
        btnLim.textContent = 'Set limit';
        btnLim.onclick = () => {
          const n = prompt('Max IDs ' + u.id + ' can create (0-1000):', u.maxSub);
          if (n !== null && n !== '') update({ id: u.id, maxSub: Number(n) });
        };
        wrap.appendChild(btnLim);
      }

      if (!isAdmin && !isSelf) {
        const btnDel = document.createElement('button');
        btnDel.textContent = 'Delete';
        btnDel.className = 'danger';
        btnDel.onclick = () => { if (confirm('Delete ' + u.id + '? This cannot be undone.')) del(u.id); };
        wrap.appendChild(btnDel);
      }

      td.appendChild(wrap);
      tbody.appendChild(tr);
    });
  }

  async function update(body) {
    msg('');
    const r = await api('/api/users/update', jpost(body));
    const j = await r.json();
    if (!r.ok) return msg(j.error, false);
    msg('Updated.', true);
    load();
  }
  async function del(id) {
    const r = await api('/api/users/delete', jpost({ id }));
    const j = await r.json();
    if (!r.ok) return msg(j.error, false);
    msg('Deleted ' + id, true);
    load();
  }

  $('create').onclick = async () => {
    msg('');
    const r = await api('/api/users', jpost({ id: $('nid').value, password: $('npw').value }));
    const j = await r.json();
    if (!r.ok) return msg(j.error, false);
    msg('Created ' + $('nid').value, true);
    $('nid').value = ''; $('npw').value = '';
    load();
  };
  $('npw').addEventListener('keydown', e => { if (e.key === 'Enter') $('create').click(); });

  $('logout').onclick = async () => {
    await fetch('/api/logout', jpost({}));
    location.href = '/login';
  };

  (async () => { await loadMe(); load(); })();
</script>
</body>
</html>
